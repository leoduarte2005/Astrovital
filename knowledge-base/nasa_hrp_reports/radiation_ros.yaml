id: HRP-RISK-RADIATION-ROS
seed_id: radiation_ros
title: 'Radiação: Estresse Oxidativo (CANS/ROS) por SPE/GCR'
hazard: Space Radiation
category: PHYSIOLOGICAL
subsystems:
  - NEUROBEHAVIORAL_RADIATION
problem: 'Eventos SPE e GCR geram espécies reativas de oxigênio (ROS) e efeitos agudos como náusea e fadiga. Contramedidas: abrigo e antioxidantes (Vitaminas C e E).'
symptoms:
  pt:
    - náusea
    - fadiga
    - cefaleia
    - mal-estar
    - tontura
    - visão turva
  en:
    - nausea
    - fatigue
    - headache
    - malaise
    - dizziness
    - blurred vision
    - oxidative stress
    - ROS
sensor_signatures:
  - sensor: Central
    metric: radiation_context
    op: eq
    threshold: 1.0
    causal_weight: 6.0
    weight_basis: causal_graph:likelihood_ratio
  - sensor: MAX30102/CSI
    metric: hrv_ms
    op: lte
    threshold: 30.0
    causal_weight: 1.8
    weight_basis: causal_graph:likelihood_ratio
detection:
  - Alerta SPE e dosímetros
  - HRV em queda (MODE_RADIATION_ALERT)
  - Autoexame de sintomas
countermeasures:
  - order: 1
    action: Abrigo de maior blindagem (storm shelter / water wall)
    protocol: null
  - order: 2
    action: Verificar dosímetros e confirmar alerta SPE
    protocol: null
  - order: 3
    action: Hidratação e Vitaminas C e E; antiemético se náusea
    protocol: null
  - order: 4
    action: Monitorar sinais vitais
    protocol: null
escalation:
  default: STORE_AND_FORWARD
  LOCAL: Conduta de abrigo autônoma.
  CREW: Alertar tripulação e mover todos ao abrigo.
  STORE_AND_FORWARD: Pacote com dosimetria e HRV ao cirurgião de voo.
source:
  document: NASA Human Research Program (HRP), Human Research Roadmap - Risk of Acute and Late CNS Effects / Radiation Carcinogenesis
  section: Evidence Report
  source_id: NASA-HRP-RADIATION
disclaimer: Apoio a decisao. Nao substitui o cirurgiao de voo.
