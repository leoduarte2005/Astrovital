id: HRP-RISK-DCS
seed_id: dcs_post_eva
title: Doença Descompressiva pós-EVA (DCS)
hazard: Hostile/Closed Environments
category: PHYSIOLOGICAL
subsystems:
  - CARDIOVASCULAR_FLUIDS
problem: 'Atividade extraveicular com baixa pressão de traje pode gerar bolhas de gás e DCS. Sinais: dor articular, parestesia, dispneia, dessaturação.'
symptoms:
  pt:
    - dor articular
    - tontura
    - falta de ar
    - formigamento
    - confusão
    - dor no peito
    - lesão cutânea
  en:
    - joint pain
    - dizziness
    - dyspnea
    - paresthesia
    - confusion
    - chest pain
    - rash
    - decompression sickness
sensor_signatures:
  - sensor: Central
    metric: eva_context
    op: eq
    threshold: 1.0
    causal_weight: 6.0
    weight_basis: causal_graph:likelihood_ratio
  - sensor: MAX30102
    metric: spo2_pct
    op: lte
    threshold: 94.0
    causal_weight: 2.5
    weight_basis: causal_graph:likelihood_ratio
  - sensor: MAX30102
    metric: heart_rate_bpm
    op: gte
    threshold: 95.0
    causal_weight: 1.8
    weight_basis: causal_graph:likelihood_ratio
detection:
  - Histórico EVA/despressurização na Central
  - 'MAX30102: SpO2 e FC'
  - Autoexame neurológico e articular
countermeasures:
  - order: 1
    action: O2 100% em máscara de alto fluxo
    protocol: null
  - order: 2
    action: Imobilizar membro afetado e avaliar déficit neurológico
    protocol: null
  - order: 3
    action: Iniciar repressurização em traje ou câmara de bordo
    protocol: null
  - order: 4
    action: Escalonar alerta médico de emergência
    protocol: null
escalation:
  default: STORE_AND_FORWARD
  LOCAL: Sem manejo exclusivamente local.
  CREW: Chamar toda a tripulação imediatamente.
  STORE_AND_FORWARD: 'Emergência: enfileirar com prioridade máxima.'
source:
  document: NASA Human Research Program (HRP), Human Research Roadmap - Risk of Decompression Sickness; NASA-STD-3001 Vol. 1/2
  section: EVA / decompression
  source_id: NASA-HRP-DCS
disclaimer: Apoio a decisao. Nao substitui o cirurgiao de voo.
