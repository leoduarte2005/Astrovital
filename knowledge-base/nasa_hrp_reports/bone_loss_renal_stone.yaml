id: HRP-RISK-BONE-RENAL
seed_id: bone_loss_renal_stone
title: Perda Óssea e Muscular / Cálculo Renal
hazard: Gravity Fields
category: PHYSIOLOGICAL
subsystems:
  - MUSCULOSKELETAL_POSTURE
problem: Descarga mecânica reduz densidade óssea e massa muscular; reabsorção óssea eleva calciúria e risco de cálculo renal.
symptoms:
  pt:
    - dor no flanco
    - dor lombar
    - hematúria
    - náusea
    - disúria
    - fraqueza muscular
  en:
    - flank pain
    - back pain
    - hematuria
    - nausea
    - dysuria
    - muscle weakness
    - bone loss
    - kidney stone
sensor_signatures:
  - sensor: Central
    metric: mission_day
    op: gte
    threshold: 14.0
    causal_weight: 2.0
    weight_basis: causal_graph:likelihood_ratio
  - sensor: MAX30102
    metric: heart_rate_bpm
    op: gte
    threshold: 90.0
    causal_weight: 1.7
    weight_basis: causal_graph:likelihood_ratio
    note: Taquicardia por dor
  - sensor: CSI
    metric: exercise_cadence_hz
    op: lt
    threshold: 0.5
    causal_weight: 1.5
    weight_basis: heuristic_pending_clinical_review
    note: Baixa adesão ao treino resistivo
detection:
  - Cadência de treino via CSI (MODE_COUNTERMEASURE_EXERCISE)
  - 'Autoexame: fita urinária'
  - 'Autoexame: ultrassom renal'
countermeasures:
  - order: 1
    action: Hidratação oral > 2.5 L/dia
    protocol: null
  - order: 2
    action: Fita urinária (hematúria/pH) e ultrassom renal
    protocol: null
  - order: 3
    action: Revisar adesão a ARED e citrato de potássio
    protocol: null
  - order: 4
    action: 'Dor intensa ou febre: analgesia protocolada e notificar cirurgião de voo'
    protocol: null
escalation:
  default: CREW
  LOCAL: Hidratação e ajuste de exercício.
  CREW: 'Dor aguda: alertar tripulante para ultrassom.'
  STORE_AND_FORWARD: 'Dor intensa, febre ou hematúria persistente: Store-and-Forward.'
source:
  document: NASA Human Research Program (HRP), Human Research Roadmap - Risk of Bone Fracture / Renal Stone Formation
  section: Evidence Report
  source_id: NASA-HRP-BONE-RENAL
disclaimer: Apoio a decisao. Nao substitui o cirurgiao de voo.
