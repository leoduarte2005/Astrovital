id: HRP-RISK-CV-FLUID
seed_id: cv_fluid_shift_orthostatic
title: Fluid Shift e Intolerância Ortostática / Cardiovascular Adaptations
hazard: Gravity Fields
category: PHYSIOLOGICAL
subsystems:
  - CARDIOVASCULAR_FLUIDS
problem: 'Redistribuição cefálica de fluidos e redução do volume plasmático alteram débito cardíaco e pressão arterial, com risco de intolerância ortostática. Referência ISS (wearable, n=17): PAS mediana 127 mmHg pré-voo vs 116-117 em voo.'
symptoms:
  pt:
    - tontura ao levantar
    - síncope
    - palpitação
    - face inchada
    - fadiga
  en:
    - orthostatic dizziness
    - syncope
    - palpitations
    - facial puffiness
    - fatigue
    - orthostatic intolerance
sensor_signatures:
  - sensor: MAX30102
    metric: heart_rate_bpm
    op: gte
    threshold: 95.0
    causal_weight: 1.8
    weight_basis: heuristic_pending_clinical_review
    note: Aumento de FC >= 30 bpm com queda de pressão de pulso
  - sensor: CSI
    metric: posture
    op: in
    threshold:
      - supine
      - prone
    causal_weight: 1.8
    weight_basis: causal_graph:likelihood_ratio
detection:
  - 'Autoexame: pressão arterial em repouso e ortostática'
  - FC via MAX30102/CSI
countermeasures:
  - order: 1
    action: Medir pressão arterial em repouso e ortostática
    protocol: blood_pressure
  - order: 2
    action: Thigh Cuffs/LBNP conforme indicação
    protocol: null
  - order: 3
    action: Hidratação e sal conforme protocolo de bordo
    protocol: null
  - order: 4
    action: Evitar levantar rápido; registrar SELF_EXAM
    protocol: null
escalation:
  default: CREW
  LOCAL: Hidratação e medida de PA.
  CREW: 'Síncope ou pré-síncope: alertar tripulante.'
  STORE_AND_FORWARD: 'Hipotensão persistente: Store-and-Forward.'
source:
  document: NASA Human Research Program (HRP), Human Research Roadmap - Risk of Cardiovascular Adaptations; JAMA Netw Open 2019 (n=11) via database/space_health_sqlite
  section: Evidence Report
  source_id: NASA-HRP-CV-FLUID
disclaimer: Apoio a decisao. Nao substitui o cirurgiao de voo.
