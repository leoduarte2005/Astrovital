id: HRP-HAZ-DISTANCE
seed_id: hazard_distance_from_earth
title: 'Perigo: Distância da Terra / Distance from Earth'
hazard: Distance from Earth
category: HAZARD
subsystems:
  - IMMUNE_HEMATO_NUTRITION
problem: Atraso de comunicação de até 22 minutos e impossibilidade de evacuação exigem autonomia clínica local e escalonamento assíncrono (Store-and-Forward).
symptoms:
  pt:
    - dependência de suporte médico remoto
    - atraso de comunicação
    - autonomia médica
    - autoexame guiado
  en:
    - remote medical support dependence
    - communication delay
    - medical autonomy
    - guided self-exam
sensor_signatures:
  - sensor: Central
    metric: comm_delay_min
    op: gte
    threshold: 5.0
    causal_weight: 1.0
    weight_basis: heuristic_pending_clinical_review
    note: Atraso do enlace Terra-nave
detection:
  - Estado do enlace na Central
  - 'Autoexames guiados: ultrassom, glicemia capilar, pressão arterial, temperatura'
countermeasures:
  - order: 1
    action: Executar autoexame guiado pertinente
    protocol: amsler_grid
  - order: 2
    action: Registrar achados via SELF_EXAM
    protocol: null
  - order: 3
    action: Enfileirar pacote Store-and-Forward quando conduta local for insuficiente
    protocol: null
escalation:
  default: STORE_AND_FORWARD
  LOCAL: Resolver autonomamente com protocolo e baixo risco.
  CREW: 'Acionar outro tripulante para exames em dupla (ex.: ultrassom).'
  STORE_AND_FORWARD: Enfileirar pacote assíncrono aos cirurgiões de voo na Terra.
source:
  document: NASA Human Research Program (HRP), Human Research Roadmap - Distance from Earth hazard; CSA
  section: Hazard overview
  source_id: NASA-HRP-HAZ-DISTANCE
disclaimer: Apoio a decisao. Nao substitui o cirurgiao de voo.
