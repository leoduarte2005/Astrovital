  - sensor: DOSIMETER/Central
    metric: cumulative_dose_msv
    op: gte
    threshold: null
    causal_weight: 1.0
    weight_basis: heuristic_pending_clinical_review
    note: Limiar definido pela agência; não inferido aqui
detection:
  - Dosímetros pessoais
  - Séries de radiação da missão (contexto)
countermeasures:
  - order: 1
    action: Minimizar exposição com abrigo em SPE
    protocol: null
  - order: 2
    action: Registrar dose cumulativa
    protocol: null
  - order: 3
    action: Revisão periódica pelo cirurgião de voo
    protocol: null
escalation:
  default: STORE_AND_FORWARD
  LOCAL: Registro de dose.
  CREW: Não aplicável (risco crônico).
  STORE_AND_FORWARD: Relatório periódico de dose acumulada.
source:
