id: HRP-RISK-RAD-CANCER
seed_id: radiation_cancer_risk
title: Risco de Câncer por Radiação / Radiation Carcinogenesis
hazard: Space Radiation
category: PHYSIOLOGICAL
subsystems:
  - NEUROBEHAVIORAL_RADIATION
problem: Exposição cumulativa a GCR e SPE aumenta o risco de câncer ao longo da carreira. Risco de longo prazo; sem inferência de dose individual a bordo.
symptoms:
  pt:
    - radiação
    - exposição cumulativa
    - dose acumulada
  en:
    - radiation
    - cumulative exposure
    - carcinogenesis
    - cancer risk
    - GCR
