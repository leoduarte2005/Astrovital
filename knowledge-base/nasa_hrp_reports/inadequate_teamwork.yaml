id: HRP-RISK-TEAM
seed_id: inadequate_teamwork
title: Trabalho em Equipe Inadequado / Inadequate Teamwork
hazard: Isolation and Confinement
category: BEHAVIORAL_BIOCHEMICAL
subsystems:
  - NEUROBEHAVIORAL_RADIATION
problem: Falhas de coordenação, comunicação e coesão entre tripulantes aumentam erros e conflitos.
symptoms:
  pt:
    - conflito
    - falha de comunicação
    - irritabilidade
    - baixa coesão
  en:
    - conflict
    - communication failure
    - irritability
    - low cohesion
    - teamwork
sensor_signatures:
  - sensor: CSI
    metric: crew_proximity_index
    op: lt
    threshold: null
    causal_weight: 1.0
    weight_basis: heuristic_pending_clinical_review
    note: Menor interação em cabine (tomografia)
detection:
  - Padrões de presença/locomoção via MODE_CABIN_TOMOGRAPHY
  - Autorrelato de coesão
countermeasures:
  - order: 1
    action: Briefing e debriefing estruturados
    protocol: null
  - order: 2
    action: Mediação pelo Comandante
    protocol: null
  - order: 3
    action: Revisar escala de tarefas
    protocol: null
escalation:
  default: CREW
  LOCAL: Conversa direta.
  CREW: Mediação do Comandante.
  STORE_AND_FORWARD: 'Conflito persistente: relatório ao suporte em solo.'
source:
  document: NASA Human Research Program (HRP), Human Research Roadmap - Risk of Performance and Behavioral Health Decrements due to Inadequate Cooperation, Coordination, Communication
  section: Evidence Report
  source_id: NASA-HRP-TEAM
disclaimer: Apoio a decisao. Nao substitui o cirurgiao de voo.
