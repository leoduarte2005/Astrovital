id: HRP-RISK-NUTRITION
seed_id: inadequate_nutrition
title: Nutrição e Alimentação Inadequadas / Inadequate Food and Nutrition
hazard: Hostile/Closed Environments
category: BEHAVIORAL_BIOCHEMICAL
subsystems:
  - IMMUNE_HEMATO_NUTRITION
problem: Adequação do sistema alimentar afeta saúde, desempenho e massa óssea e muscular. Seguir Nutrition SMO. Este banco não prescreve suplementação.
symptoms:
  pt:
    - fadiga
    - perda de peso
    - fraqueza
    - tontura
    - apetite reduzido
    - hidratação baixa
  en:
    - fatigue
    - weight loss
    - weakness
    - dizziness
    - low appetite
    - low hydration
    - Nutrition SMO
sensor_signatures:
  - sensor: Autoexame
    metric: hydration_index
    op: lt
    threshold: 0.5
    causal_weight: 1.8
    weight_basis: heuristic_pending_clinical_review
  - sensor: Autoexame
    metric: weight_change_pct
    op: lte
    threshold: -3.0
    causal_weight: 1.5
    weight_basis: heuristic_pending_clinical_review
detection:
  - Registro alimentar e hidratação
  - 'Autoexame: sangue capilar (glicemia)'
countermeasures:
  - order: 1
    action: Revisar registro alimentar e hidratação (Nutrition SMO)
    protocol: null
  - order: 2
    action: Vitamina D e proteína conforme protocolo de bordo
    protocol: null
  - order: 3
    action: Relatório ao cirurgião de voo
    protocol: capillary_blood
escalation:
  default: LOCAL
  LOCAL: Ajuste alimentar.
  CREW: 'Perda de peso > 3%: avisar tripulante.'
  STORE_AND_FORWARD: Relatório periódico.
source:
  document: NASA Human Research Program (HRP), Human Research Roadmap - Risk of Inadequate Food and Nutrition; Nutrition SMO
  section: Evidence Report
  source_id: NASA-HRP-NUTRITION
disclaimer: Apoio a decisao. Nao substitui o cirurgiao de voo.
