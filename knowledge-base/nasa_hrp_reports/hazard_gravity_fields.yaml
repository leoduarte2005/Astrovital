id: HRP-HAZ-GRAVITY
seed_id: hazard_gravity_fields
title: 'Perigo: Campos Gravitacionais (microgravidade) / Altered Gravity Fields'
hazard: Gravity Fields
category: HAZARD
subsystems:
  - CARDIOVASCULAR_FLUIDS
problem: Microgravidade desloca fluidos cranialmente, reduz carga mecânica em osso e músculo e altera os sistemas cardiovascular, vestibular e imune.
symptoms:
  pt:
    - face inchada
    - congestão nasal
    - cefaleia
    - tontura ortostática
    - dor lombar
    - fraqueza muscular
    - visão turva
  en:
    - facial puffiness
    - nasal congestion
    - headache
    - orthostatic dizziness
    - back pain
    - muscle weakness
    - blurred vision
sensor_signatures:
  - sensor: CSI
    metric: posture
    op: in
    threshold:
      - supine
      - prone
    causal_weight: 1.8
    weight_basis: causal_graph:likelihood_ratio
    note: Decúbito favorece redistribuição cefálica
  - sensor: Central
    metric: mission_day
    op: gte
    threshold: 7.0
    causal_weight: 2.1
    weight_basis: causal_graph:likelihood_ratio
    note: Exposição prolongada
detection:
  - Postura via CSI (MODE_CABIN_TOMOGRAPHY)
  - Cinemática em MODE_COUNTERMEASURE_EXERCISE
  - 'Autoexame: pressão arterial, ultrassom, Amsler'
countermeasures:
  - order: 1
    action: Exercício resistivo e aeróbico diário (ARED/esteira)
    protocol: null
  - order: 2
    action: Thigh Cuffs ou LBNP para fluid shift cefálico
    protocol: blood_pressure
  - order: 3
    action: Revisar hidratação e nutrição (vitamina D, proteína)
    protocol: null
escalation:
  default: CREW
  LOCAL: Rotina preventiva de exercício.
  CREW: Alertar tripulante para exames em dupla.
  STORE_AND_FORWARD: Enfileirar tendência mensal ao cirurgião de voo.
source:
  document: NASA Human Research Program (HRP), Human Research Roadmap - Altered Gravity Fields hazard
  section: Hazard overview
  source_id: NASA-HRP-HAZ-GRAVITY
disclaimer: Apoio a decisao. Nao substitui o cirurgiao de voo.
