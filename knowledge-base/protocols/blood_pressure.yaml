id: blood_pressure
title: Pressão Arterial em Repouso e Ortostática
duration_s: 420
materials:
  - Manguito de pressão arterial automático
  - Cronômetro de bordo
  - Tira de fixação para posição supina
steps:
  - text: Repouse por 5 minutos com o manguito na altura do coração.
    image: protocols/bp_rest.svg
    timer_s: 300
    safety_note: Pare se houver tontura intensa.
  - text: Meça pressão sistólica, diastólica e frequência cardíaca.
    image: protocols/bp_measure.svg
    timer_s: 60
    safety_note: Mantenha o braço relaxado e imóvel.
  - text: Se indicado, repita após Thigh Cuffs ou LBNP.
    image: protocols/bp_repeat.svg
    timer_s: 60
    safety_note: Interrompa o manguito se houver dormência ou dor.
  - text: Registre em SELF_EXAM e sinalize queda da pressão de pulso com FC +30 bpm.
    image: protocols/bp_record.svg
    timer_s: 15
    safety_note: 'Pré-síncope: deite e avise um tripulante.'
result_schema:
  type: object
  required:
    - systolic_mmhg
    - diastolic_mmhg
    - position
  properties:
    systolic_mmhg:
      type: integer
      minimum: 50
      maximum: 250
    diastolic_mmhg:
      type: integer
      minimum: 30
      maximum: 150
    heart_rate_bpm:
      type:
        - integer
        - 'null'
      minimum: 30
      maximum: 220
    position:
      type: string
      enum:
        - seated
        - supine
        - standing
        - lbnp
        - thigh_cuffs
linked_risks:
  - HRP-RISK-CV-FLUID
  - HRP-RISK-SANS
  - HRP-HAZ-GRAVITY
