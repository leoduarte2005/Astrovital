[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edgespace-ai"
version = "0.1.0"
description = "Edge Space AI worker for CSI DSP, ONNX biometric inference, and clinical correlation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "onnxruntime>=1.17.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
train = [
    "scikit-learn>=1.4.0",
    "skl2onnx>=1.16.0",
    "onnx>=1.15.0",
]
slm = [
    "llama-cpp-python>=0.3.0",
]
test = [
    "pytest>=8.0.0",
]
dev = [
    "scikit-learn>=1.4.0",
    "skl2onnx>=1.16.0",
    "onnx>=1.15.0",
    "pytest>=8.0.0",
]
finetune = [
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "datasets>=2.20.0",
    "trl>=0.9.6",
    "accelerate>=0.33.0",
    "bitsandbytes>=0.43.0; platform_system != 'Darwin'",
    "huggingface_hub>=0.24.0",
    "sentencepiece>=0.2.0",
    "safetensors>=0.4.3",
]

[project.scripts]
edgespace-ai = "edgespace_ai.main:main"
edgespace-slm-fetch = "edgespace_ai.utils.model_fetch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

