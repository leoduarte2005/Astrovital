version: 1
source: "NASA Human Research Program (HRP) Clinical Causal Knowledge Base"
conditions:
  - id: "sans_viip"
    name: "SANS / VIIP (Cephalic Fluid Shift)"
    source_id: "NASA-HRP-SANS"
    subsystem: "NEURO_OCULAR_SANS"
    prior: 0.15
    default_escalation: "CREW"
    symptoms:
      headache: 0.75
      photophobia: 0.90
      blurred_vision: 0.95
      visual_disturbance: 0.95
      eye_pressure: 0.85
      fluid_shift: 0.90
      nasal_congestion: 0.65
      facial_puffiness: 0.70
      papilledema: 0.90
    sensor_rules:
      - metric: "co2_ppm"
        op: "lt"
        value: 1500.0
        likelihood_ratio: 1.4
        description: "Nominal cabin CO2 reduces likelihood of primary hypercapnia"
      - metric: "posture"
        op: "in"
        values: ["supine", "prone"]
        likelihood_ratio: 1.15
        description: "Rest/recumbent posture favors cephalic fluid redistribution"
      - metric: "mission_day"
        op: "gte"
        value: 7.0
        likelihood_ratio: 1.15
        description: "Prolonged microgravity exposure (>= 7 days)"
      - metric: "anomaly_score"
        op: "gte"
        value: 0.40
        likelihood_ratio: 1.4
        description: "CSI physiological deviation above baseline"
    countermeasures:
      - "1. Perform the Amsler Grid exam to evaluate macular distortion or scotomas."
      - "2. Apply Thigh Cuffs (Braslet) or LBNP to reduce cephalic fluid shift."
      - "3. Administer B-Complex supplementation (folic acid, B6, and B12) per NASA-HRP-SANS metabolic protocol."
      - "4. Record findings in SELF_EXAM and forward telemetry for Flight Surgeon review (Store-and-Forward)."
    actions:
      - "OPEN_AMSLER_GRID"
      - "LOG_SELF_EXAM"
      - "CHECK_FLUID_SHIFT_PROTOCOL"
    disambiguation_questions:
      - id: "amsler_grid"
        prompt: "When looking at the Amsler Grid, do you notice wavy lines, blurry vision, or ocular/facial pressure?"
        positive_concepts: ["blurred_vision", "visual_disturbance", "photophobia", "eye_pressure", "facial_puffiness", "nasal_congestion"]
        yes_likelihood: 0.85
        no_likelihood: 0.15

  - id: "hypercapnia_co2"
    name: "CO2 Hypercapnia"
    source_id: "NASA-HRP-CO2"
    subsystem: "RESPIRATORY_ATMOSPHERE"
    prior: 0.18
    default_escalation: "CREW"
    symptoms:
      headache: 0.90
      photophobia: 0.25
      dizziness: 0.75
      fatigue: 0.65
      dyspnea: 0.80
      confusion: 0.70
      nausea: 0.50
      flushed_skin: 0.60
    sensor_rules:
      - metric: "co2_ppm"
        op: "gte"
        value: 1500.0
        likelihood_ratio: 4.5
        description: "SCD40 detects elevated CO2 (>= 1500 ppm)"
      - metric: "co2_ppm"
        op: "gte"
        value: 2500.0
        likelihood_ratio: 8.5
        description: "SCD40 above YELLOW hypercapnia threshold (>= 2500 ppm)"
      - metric: "co2_ppm"
        op: "gte"
        value: 3000.0
        likelihood_ratio: 10.0
        description: "SCD40 at critical hypercapnia level (>= 3000 ppm)"
      - metric: "respiration_hz"
        op: "gte"
        value: 0.32
        likelihood_ratio: 2.2
        description: "Compensatory tachypnea detected via CSI"
      - metric: "heart_rate_bpm"
        op: "gte"
        value: 85.0
        likelihood_ratio: 1.5
        description: "Sympathetic heart rate elevation"
    countermeasures:
      - "1. Verify SCD40 reading and check CO2 scrubber status (CDRA / LiOH cartridges)."
      - "2. Increase local cabin ventilation and redirect airflow toward the occupied zone."
      - "3. Reduce physical exertion until CO2 stabilizes below 1000 ppm."
      - "4. If CO2 >= 3000 ppm or mental confusion occurs, use an O2 mask and alert the crew."
    actions:
      - "OPEN_VENTILATION_CHECK"
      - "INSPECT_CDRA_SCRUBBER"
      - "MONITOR_SCD40"
    disambiguation_questions:
      - id: "ventilation_air"
        prompt: "Does the headache improve near a ventilation outlet, or do you feel stuffy air / shortness of breath?"
        positive_concepts: ["dyspnea", "dizziness"]
        yes_likelihood: 0.80
        no_likelihood: 0.25

  - id: "hypoxia"
    name: "Cabin Hypoxia"
    source_id: "NASA-HRP-HYPOXIA"
    subsystem: "RESPIRATORY_ATMOSPHERE"
    prior: 0.08
    default_escalation: "STORE_AND_FORWARD"
    symptoms:
      dyspnea: 0.90
      dizziness: 0.85
      confusion: 0.85
      cyanosis: 0.95
      headache: 0.60
      fatigue: 0.70
    sensor_rules:
      - metric: "spo2_pct"
        op: "lte"
        value: 94.0
        likelihood_ratio: 10.0
        description: "Arterial desaturation on MAX30102 pulse oximeter (SpO2 <= 94%)"
      - metric: "spo2_pct"
        op: "lte"
        value: 90.0
        likelihood_ratio: 12.0
        description: "Critical desaturation on MAX30102 pulse oximeter (SpO2 <= 90%)"
      - metric: "pressure_hpa"
        op: "lte"
        value: 750.0
        likelihood_ratio: 6.0
        description: "Cabin atmospheric pressure drop on BME280"
      - metric: "respiration_hz"
        op: "gte"
        value: 0.35
        likelihood_ratio: 2.0
        description: "Hypoxic hyperventilation detected via CSI"
      - metric: "heart_rate_bpm"
        op: "gte"
        value: 95.0
        likelihood_ratio: 1.8
        description: "Compensatory tachycardia"
    countermeasures:
      - "1. Confirm SpO2 immediately on MAX30102 pulse oximeter and cabin pressure on BME280."
      - "2. Inspect O2 supply and module pressure seal integrity."
      - "3. Administer supplemental oxygen immediately if SpO2 <= 92%."
      - "4. Trigger STORE_AND_FORWARD escalation to ground medical team."
    actions:
      - "ADMINISTER_O2"
      - "CHECK_CABIN_PRESSURE"
      - "VERIFY_MAX30102"
    disambiguation_questions:
      - id: "pulse_ox_check"
        prompt: "Do you feel sudden shortness of breath, tingling in extremities, or visual darkening while using MAX30102?"
        positive_concepts: ["dyspnea", "cyanosis", "confusion"]
        yes_likelihood: 0.85
        no_likelihood: 0.20

  - id: "sleep_immune_deprivation"
    name: "Sleep Deprivation / Circadian & Immune Dysregulation"
    source_id: "NASA-HRP-BMed-IMMUNE"
    subsystem: "IMMUNE_HEMATO_NUTRITION"
    prior: 0.16
    default_escalation: "LOCAL"
    symptoms:
      fatigue: 0.90
      insomnia: 0.90
      headache: 0.50
      photophobia: 0.30
      confusion: 0.55
      malaise: 0.75
      rash_infection: 0.70
    sensor_rules:
      - metric: "hrv_ms"
        op: "lte"
        value: 30.0
        likelihood_ratio: 2.6
        description: "HRV drop (RMSSD <= 30 ms) indicating autonomic stress"
      - metric: "temp_c"
        op: "gte"
        value: 37.5
        likelihood_ratio: 2.2
        description: "Thermal elevation consistent with inflammatory/immune response"
      - metric: "heart_rate_bpm"
        op: "gte"
        value: 78.0
        likelihood_ratio: 1.4
        description: "Elevated resting baseline heart rate"
    countermeasures:
      - "1. Review sleep duration and quality over the past 24h alongside HRV trend."
      - "2. Adjust circadian lighting spectrum (reduce blue light 2h before sleep)."
      - "3. Suspend stimulants 6h before sleep window and reduce operational workload."
      - "4. If fever or skin lesion/viral reactivation appears, log SELF_EXAM."
    actions:
      - "ADJUST_LIGHTING_CIRCADIAN"
      - "LOG_SLEEP_REST"
      - "CHECK_HRV_TREND"
    disambiguation_questions:
      - id: "sleep_hours"
        prompt: "How many consecutive hours did you sleep in the last 24h, and do you have fever or any skin rash?"
        positive_concepts: ["insomnia", "fatigue", "rash_infection"]
        yes_likelihood: 0.80
        no_likelihood: 0.20

  - id: "bone_loss_renal_stone"
    name: "Bone Loss / Renal Stone Risk"
    source_id: "NASA-HRP-BONE-RENAL"
    subsystem: "MUSCULOSKELETAL_POSTURE"
    prior: 0.10
    default_escalation: "CREW"
    symptoms:
      flank_pain: 0.95
      back_pain: 0.80
      hematuria: 0.95
      nausea: 0.60
      dysuria: 0.85
      abdominal_pain: 0.45
      bone_pain: 0.80
      muscle_weakness: 0.50
    sensor_rules:
      - metric: "mission_day"
        op: "gte"
        value: 14.0
        likelihood_ratio: 1.2
        description: "Bone resorption and hypercalciuria rise after 14 mission days"
      - metric: "heart_rate_bpm"
        op: "gte"
        value: 90.0
        likelihood_ratio: 1.7
        description: "Reactive tachycardia due to acute pain"
    countermeasures:
      - "1. Immediately increase oral hydration (> 2.5 L/day) to promote diuresis."
      - "2. Perform urine dipstick test (hematuria/pH) and onboard renal ultrasound."
      - "3. Review adherence to resistive exercise (ARED) and potassium citrate protocol."
      - "4. If severe flank pain or fever develops, initiate protocol analgesia and notify Flight Surgeon."
    actions:
      - "INCREASE_HYDRATION"
      - "LOG_URINALYSIS"
      - "CHECK_ARED_COMPLIANCE"
    disambiguation_questions:
      - id: "flank_radiation"
        prompt: "Does the lower back pain radiate to the flank/groin, or is there burning/dark urine?"
        positive_concepts: ["flank_pain", "hematuria", "dysuria"]
        yes_likelihood: 0.90
        no_likelihood: 0.10

  - id: "iron_overload"
    name: "Iron Overload / Hemoconcentration"
    source_id: "NASA-HRP-IRON-HEMATO"
    subsystem: "IMMUNE_HEMATO_NUTRITION"
    prior: 0.07
    default_escalation: "LOCAL"
    symptoms:
      fatigue: 0.80
      joint_pain: 0.85
      abdominal_pain: 0.55
      malaise: 0.65
      dizziness: 0.45
    sensor_rules:
      - metric: "mission_day"
        op: "gte"
        value: 21.0
        likelihood_ratio: 1.2
        description: "Progressive iron accumulation in prolonged missions (>= 21 days)"
      - metric: "anomaly_score"
        op: "gte"
        value: 0.40
        likelihood_ratio: 1.4
        description: "Persistent deviation relative to individual baseline"
    countermeasures:
      - "1. Review onboard menu to reduce iron-fortified foods."
      - "2. Check hematologic/ferritin markers available in the onboard lab kit."
      - "3. Maintain regular hydration and log arthralgia or abdominal discomfort."
      - "4. Send periodic clinical summary to the Flight Surgeon."
    actions:
      - "REVIEW_NUTRITION_LOG"
      - "LOG_SELF_EXAM"
    disambiguation_questions:
      - id: "joint_abdominal"
        prompt: "Do you feel persistent joint pain (hands/knees) or upper abdominal discomfort?"
        positive_concepts: ["joint_pain", "abdominal_pain"]
        yes_likelihood: 0.80
        no_likelihood: 0.20

  - id: "dcs_post_eva"
    name: "Post-EVA Decompression Sickness (DCS)"
    source_id: "NASA-HRP-DCS"
    subsystem: "CARDIOVASCULAR_FLUIDS"
    prior: 0.08
    default_escalation: "STORE_AND_FORWARD"
    symptoms:
      joint_pain: 0.90
      dizziness: 0.80
      dyspnea: 0.80
      rash_infection: 0.75
      paresthesia: 0.95
      confusion: 0.75
      chest_pain: 0.90
    sensor_rules:
      - metric: "eva_context"
        op: "eq"
        value: 1.0
        likelihood_ratio: 6.0
        description: "Recent EVA / depressurization history in mission context"
      - metric: "spo2_pct"
        op: "lte"
        value: 94.0
        likelihood_ratio: 2.5
        description: "SpO2 drop compatible with pulmonary gas embolism ('chokes')"
      - metric: "heart_rate_bpm"
        op: "gte"
        value: 95.0
        likelihood_ratio: 1.8
        description: "Cardiovascular response to decompression stress"
    countermeasures:
      - "1. Administer 100% oxygen immediately via high-flow mask."
      - "2. Immobilize affected limb and assess for neurologic deficits/paresthesias."
      - "3. Initiate suit or onboard hyperbaric chamber recompression protocol."
      - "4. Escalate emergency medical alert (STORE_AND_FORWARD)."
    actions:
      - "ADMINISTER_100_O2"
      - "CHECK_EVA_LOG"
      - "PREPARE_RECOMPRESSION"
    disambiguation_questions:
      - id: "eva_recent"
        prompt: "Did symptoms start after an extravehicular activity (EVA) or depressurization, with tingling or deep joint pain?"
        positive_concepts: ["paresthesia", "joint_pain", "chest_pain"]
        yes_likelihood: 0.90
        no_likelihood: 0.10

  - id: "radiation_ros"
    name: "Radiation Exposure / Oxidative Stress (SPE/GCR)"
    source_id: "NASA-HRP-RADIATION"
    subsystem: "NEUROBEHAVIORAL_RADIATION"
    prior: 0.08
    default_escalation: "STORE_AND_FORWARD"
    symptoms:
      nausea: 0.85
      fatigue: 0.75
      headache: 0.60
      photophobia: 0.45
      malaise: 0.80
      dizziness: 0.60
      blurred_vision: 0.45
      visual_disturbance: 0.45
    sensor_rules:
      - metric: "radiation_context"
        op: "eq"
        value: 1.0
        likelihood_ratio: 6.0
        description: "Radiation alert (SPE/GCR) or MODE_RADIATION_ALERT active"
      - metric: "hrv_ms"
        op: "lte"
        value: 30.0
        likelihood_ratio: 1.8
        description: "HRV reduction from oxidative/autonomic stress"
    countermeasures:
      - "1. Move crew to the highest-shielding storm shelter / water wall area."
      - "2. Check personal dosimeter readings and confirm SPE alert with mission control."
      - "3. Maintain hydration and administer antioxidant/antiemetic protocol if prodromal nausea is present."
      - "4. Monitor continuous vital signs and log clinical progression."
    actions:
      - "MOVE_TO_STORM_SHELTER"
      - "CHECK_DOSIMETER"
      - "MONITOR_VITALS"
    disambiguation_questions:
      - id: "nausea_prodrome"
        prompt: "Is there prodromal nausea/vomiting or an active solar particle event (SPE) alert?"
        positive_concepts: ["nausea", "malaise"]
        yes_likelihood: 0.85
        no_likelihood: 0.15

  - id: "cns_radiation_effects"
    name: "Neurobehavioral & CNS Radiation Effects (SPE/GCR)"
    source_id: "NASA-HRP-CNS-RAD"
    subsystem: "NEUROBEHAVIORAL_RADIATION"
    prior: 0.07
    default_escalation: "STORE_AND_FORWARD"
    symptoms:
      photophobia: 0.45
      headache: 0.65
      confusion: 0.80
      fatigue: 0.70
      dizziness: 0.60
      visual_disturbance: 0.45
    sensor_rules:
      - metric: "radiation_context"
        op: "eq"
        value: 1.0
        likelihood_ratio: 5.5
        description: "Solar storm alert (SPE) or active radiation event"
      - metric: "hrv_ms"
        op: "lte"
        value: 30.0
        likelihood_ratio: 1.7
        description: "Autonomic/oxidative stress compatible with radiation exposure"
    countermeasures:
      - "1. Move crew immediately to highest-shielding area (storm shelter)."
      - "2. Verify personal dosimeters and confirm solar particle event (SPE) bulletin."
      - "3. Perform neurocognitive screening and log visual/headache progression in SELF_EXAM."
    actions:
      - "MOVE_TO_STORM_SHELTER"
      - "CHECK_DOSIMETER"
      - "LOG_SELF_EXAM"
    disambiguation_questions:
      - id: "spe_exposure"
        prompt: "Has there been a recent solar particle event (SPE) alert or cognitive/attention changes with light sensitivity?"
        positive_concepts: ["confusion", "photophobia"]
        yes_likelihood: 0.85
        no_likelihood: 0.15

  - id: "gi_motility_microbiome"
    name: "Gastrointestinal Slowdown & Dysbiosis in Microgravity"
    source_id: "NASA-HRP-GI-MICROBIOME"
    subsystem: "IMMUNE_HEMATO_NUTRITION"
    prior: 0.14
    default_escalation: "LOCAL"
    symptoms:
      abdominal_pain: 0.90
      gi_slowdown: 0.95
      nausea: 0.70
      malaise: 0.45
    sensor_rules:
      - metric: "humidity_pct"
        op: "lt"
        value: 35.0
        likelihood_ratio: 1.7
        description: "Low cabin humidity on BME280 promotes dehydration and GI slowdown"
      - metric: "mission_day"
        op: "gte"
        value: 5.0
        likelihood_ratio: 1.15
        description: "Reduced GI motility and microbiome/pharmacokinetic shifts in microgravity"
      - metric: "temp_c"
        op: "gte"
        value: 26.0
        likelihood_ratio: 1.4
        description: "Elevated cabin temperature increases basal fluid loss"
      - metric: "heart_rate_bpm"
        op: "gte"
        value: 85.0
        likelihood_ratio: 1.3
        description: "Mild HR elevation associated with abdominal discomfort or mild hypovolemia"
    countermeasures:
      - "1. Reinforce fractionated hydration (> 2.5 L/day) and monitor fluid intake/output."
      - "2. Adjust onboard diet prioritizing prebiotic fiber and light, easily digestible meals."
      - "3. Review and adjust oral medication timing considering slowed GI absorption (NASA HRP GI Pharmacokinetics)."
      - "4. Monitor for fever, persistent vomiting, or flank radiation and log progression in SELF_EXAM."
    actions:
      - "INCREASE_HYDRATION"
      - "REVIEW_NUTRITION_FIBER"
      - "ADJUST_ORAL_MED_TIMING"
      - "LOG_SELF_EXAM"
    disambiguation_questions:
      - id: "gi_localization"
        prompt: "Is the abdominal pain accompanied by bloating/constipation, nausea, or radiation toward your flank?"
        positive_concepts: ["gi_slowdown", "nausea", "flank_pain"]
        yes_likelihood: 0.85
        no_likelihood: 0.15

  - id: "reduced_cardiorespiratory_fitness"
    name: "Musculoskeletal & Cardiorespiratory Deconditioning"
    source_id: "NASA-HRP-FITNESS"
    subsystem: "MUSCULOSKELETAL_POSTURE"
    prior: 0.14
    default_escalation: "LOCAL"
    symptoms:
      muscle_pain: 0.90
      muscle_weakness: 0.95
      fatigue: 0.85
      bone_pain: 0.75
      joint_pain: 0.60
      dyspnea: 0.55
    sensor_rules:
      - metric: "mission_day"
        op: "gte"
        value: 7.0
        likelihood_ratio: 1.15
        description: "Progressive muscle atrophy and bone loss in microgravity (>= 7 days)"
      - metric: "heart_rate_bpm"
        op: "gte"
        value: 85.0
        likelihood_ratio: 1.4
        description: "Relative cardiovascular load during exertion or ambulation"
      - metric: "posture"
        op: "in"
        values: ["exercising", "standing", "upright"]
        likelihood_ratio: 1.5
        description: "Symptom triggered under load or attempted ambulation"
    countermeasures:
      - "1. Assess intensity, symmetry, and location of leg pain (muscular vs joint vs calf)."
      - "2. Review recent resistive/aerobic exercise sessions (ARED and T2 treadmill) and adjust progressive load."
      - "3. Ensure adequate hydration, protein intake, and vitamin D per onboard protocol."
      - "4. If unilateral swelling or acute calf tenderness is present, execute vascular/ultrasound protocol."
    actions:
      - "CHECK_ARED_COMPLIANCE"
      - "LOG_SELF_EXAM"
      - "REVIEW_NUTRITION_LOG"
    disambiguation_questions:
      - id: "muscle_vs_vte"
        prompt: "Does leg pain worsen when walking/exerting with weakness, or is there swelling, warmth, and redness in only one calf?"
        positive_concepts: ["limb_swelling", "muscle_pain", "muscle_weakness"]
        yes_likelihood: 0.85
        no_likelihood: 0.15

  - id: "venous_thromboembolism_stasis"
    name: "Venous Stasis / Suspected Limb Thrombosis (VTE)"
    source_id: "NASA-HRP-VTE-ISS"
    subsystem: "CARDIOVASCULAR_FLUIDS"
    prior: 0.06
    default_escalation: "STORE_AND_FORWARD"
    symptoms:
      limb_swelling: 0.95
      muscle_pain: 0.85
      muscle_weakness: 0.65
      dyspnea: 0.65
      chest_pain: 0.75
    sensor_rules:
      - metric: "mission_day"
        op: "gte"
        value: 5.0
        likelihood_ratio: 1.15
        description: "Venous stasis associated with fluid shift in microgravity"
      - metric: "spo2_pct"
        op: "lte"
        value: 94.0
        likelihood_ratio: 2.5
        description: "Desaturation suggests risk of secondary pulmonary embolism"
      - metric: "heart_rate_bpm"
        op: "gte"
        value: 95.0
        likelihood_ratio: 1.8
        description: "Tachycardia associated with vascular pain or cardiopulmonary strain"
    countermeasures:
      - "1. DO NOT massage the painful limb; keep limb at rest and measure bilateral calf circumference."
      - "2. Perform onboard compressive venous ultrasound (NASA ISS VTE protocol) if available."
      - "3. Monitor continuous SpO2, shortness of breath, or chest pain via MAX30102/CSI."
      - "4. Immediately escalate alert to Flight Surgeon (Store-and-Forward)."
    actions:
      - "PERFORM_VASCULAR_ULTRASOUND"
      - "MONITOR_SPO2"
      - "ESCALATE_FLIGHT_SURGEON"
    disambiguation_questions:
      - id: "vte_unilateral"
        prompt: "Is the swelling or pain localized to only one leg/calf, with local warmth or shortness of breath?"
        positive_concepts: ["limb_swelling", "dyspnea", "chest_pain"]
        yes_likelihood: 0.90
        no_likelihood: 0.10

  - id: "cv_fluid_shift_orthostatic"
