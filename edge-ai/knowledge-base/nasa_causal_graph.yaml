      - "3. Evitar levantamentos bruscos e monitorar tontura ou pré-síncope."
    actions:
      - "INCREASE_HYDRATION"
      - "CHECK_FLUID_SHIFT_PROTOCOL"
      - "LOG_SELF_EXAM"
