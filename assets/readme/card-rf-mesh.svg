<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" width="580" height="220" role="img" aria-label="Multi-Static Wi-Fi CSI Mesh">
  <rect width="580" height="220" rx="12" fill="#0B1020" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="18" y="16" width="210" height="188" rx="10" fill="#0F172A" stroke="#1E293B"/>
  <g stroke="#38BDF8" stroke-width="1.2" opacity="0.4">
    <line x1="123" y1="44" x2="192" y2="88"/><line x1="192" y1="88" x2="166" y2="166"/>
    <line x1="166" y1="166" x2="80" y2="166"/><line x1="80" y1="166" x2="54" y2="88"/>
    <line x1="54" y1="88" x2="123" y2="44"/><line x1="123" y1="44" x2="166" y2="166"/>
    <line x1="123" y1="44" x2="80" y2="166"/><line x1="192" y1="88" x2="80" y2="166"/>
    <line x1="192" y1="88" x2="54" y2="88"/><line x1="166" y1="166" x2="54" y2="88"/>
  </g>
  <circle cx="123" cy="110" r="24" fill="none" stroke="#22C55E" stroke-width="1.4" stroke-dasharray="4 3">
    <animate attributeName="r" values="16;34;16" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="123" cy="44" r="8" fill="#0B1020" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="192" cy="88" r="8" fill="#0B1020" stroke="#22C55E" stroke-width="2"/>
  <circle cx="166" cy="166" r="8" fill="#0B1020" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="80" cy="166" r="8" fill="#0B1020" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="54" cy="88" r="8" fill="#0B1020" stroke="#F59E0B" stroke-width="2"/>

  <text x="248" y="42" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">MULTI-STATIC RF MESH + I²C</text>
  <text x="248" y="68" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700">5× ESP32-S3 TDM Tomography</text>
  <text x="248" y="92" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">• 20 directional links (5 rec.) / 6 min (3 nodes)</text>
  <text x="248" y="114" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">• N+1 automatic failover (&lt; 500 ms SlotMap)</text>
  <text x="248" y="136" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">• 2.4 GHz Ch6 HT20 · 100 ms TDM · UDP :5005</text>

  <rect x="248" y="156" width="96" height="28" rx="6" fill="#0F172A" stroke="#22C55E"/>
  <text x="296" y="174" text-anchor="middle" fill="#4ADE80" font-family="ui-monospace, monospace" font-size="10.5">MAX30102</text>
  <rect x="354" y="156" width="96" height="28" rx="6" fill="#0F172A" stroke="#38BDF8"/>
  <text x="402" y="174" text-anchor="middle" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="10.5">BME280</text>
  <rect x="460" y="156" width="96" height="28" rx="6" fill="#0F172A" stroke="#F59E0B"/>
  <text x="508" y="174" text-anchor="middle" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="10.5">SCD40 CO₂</text>
</svg>
